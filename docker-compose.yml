version: "3.8"

services:
  app:
    build: .
    image: pet-backend-image
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules_data:/app/node_modules
    environment:
      - NODE_ENV=development

      - DATABASE_URL=${DOCKER_DATABASE_URL}
    depends_on:
      - postgres_db
  postgres_db:
    image: postgres:16-alpine
    container_name: pet-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  node_modules_data:
    name: pet-backend-modules
  postgres_data:
    name: pet-backend-postgres
